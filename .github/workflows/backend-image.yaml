name: Backend Image

# main에 백엔드 변경이 들어가면 운영 서버용 이미지를 빌드해 GitHub Container Registry(ghcr.io)에 올린다.
# 메모리 1GB 서버에서는 빌드하지 않고 이 이미지를 받아서 실행만 한다 (docker-compose.prod.yml).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # latest = 서버가 받는 기본 태그, sha = 문제가 생겼을 때 이전 버전으로 되돌리는 용도
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quantpilot-backend:latest
            ghcr.io/${{ github.repository_owner }}/quantpilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
