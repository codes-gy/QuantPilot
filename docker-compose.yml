x-backend-env: &backend-env
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: quantpilot
      POSTGRES_DB: quantpilot
    # 이 PC(localhost)에서만 접속 가능하게 바인딩 — 0.0.0.0으로 열면 같은 네트워크의 다른 기기도
    # 기본 비밀번호(quantpilot)로 DB에 접속할 수 있다. 백엔드 컨테이너는 내부 네트워크로 접속하므로 영향 없음.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF로 디스크에 저장 — 저장하지 않으면 재시작 시 비상 정지(kill_switch:global)가 풀리고
    # 오늘 실현손익이 0으로 돌아가, 일일 손실 한도로 멈춘 매매가 재시작만으로 다시 시작된다.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    # 인증 없는 Redis라 반드시 localhost에만 바인딩 (비상 정지 키를 외부에서 지울 수 없게)
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # 이 PC는 공인 IP에 직접 연결돼 있어 0.0.0.0으로 열면 인터넷에서 로그인 API에 닿을 수 있다.
    # PC 브라우저(localhost)에서만 쓰도록 바인딩. 휴대폰 앱에서 접속하려면 VPN/터널 등을 따로 구성할 것.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    <<: *backend-env

  # KIS WebSocket 실시간 시세 수집 전용 프로세스 (장시간 상시 연결, Celery와 분리)
  ingestor:
    build: ./backend
    command: python -m app.features.market_data.ingestor
    volumes:
      - ./backend:/app
    <<: *backend-env

  # 전략 조건 평가 루프: Redis 시세 캐시를 구독해 신호 발생 시 trading Celery task를 호출
  strategy-runner:
    build: ./backend
    command: python -m app.features.strategy.runner
    volumes:
      - ./backend:/app
    <<: *backend-env

  # 주문 실행 등 부수효과가 있는 작업 (재시도/멱등성 필요)
  celery-worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    <<: *backend-env

  # 토큰 갱신, 일일 정산/리컨실 등 정기 작업
  celery-beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    <<: *backend-env

volumes:
  pgdata:
  redisdata:
